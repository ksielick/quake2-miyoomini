//
// Miyoo Mini Plus defaults (quake2-miyoomini). Yamagi runs this file right after
// default.cfg, at start and on Options -> reset defaults, and config.cfg (your own
// settings) comes after it. Change the buttons in Options -> customize gamepad.
//
// The buttons follow TyrQuake-Miyoo's layout (its RetroArch core's "classic" one),
// only X differs: crouch here, as Quake II needs it. SELECT held gives the
// other set: the inventory, the help computer, the previous weapon, walk/run.
//
// The Miyoo's buttons are a Nintendo-style gamepad: BTN_SOUTH = B (bottom),
// BTN_EAST = A (right), BTN_WEST = Y (left), BTN_NORTH = X (top), BTN_BACK =
// SELECT, TRIG_LEFT/RIGHT = L2/R2. START opens the menu, and so does MENU for now.
// (No semicolons in these comments: Quake splits commands at them, even here.)
//

unbindall

// D-pad: move and turn
bind	DP_UP		+forward
bind	DP_DOWN		+back
bind	DP_LEFT		+left
bind	DP_RIGHT	+right

// face buttons
bind	BTN_SOUTH	+moveup			// B: jump
bind	BTN_EAST	weapnext		// A: next weapon
bind	BTN_WEST	+attack			// Y: fire
bind	BTN_NORTH	+movedown		// X: crouch

// shoulders: strafe and look
bind	SHOULDR_LEFT	+moveleft		// L1
bind	SHOULDR_RIGHT	+moveright		// R1
bind	TRIG_LEFT	+lookup			// L2
bind	TRIG_RIGHT	+lookdown		// R2

// SELECT held: the other set
bind	BTN_BACK	+joyaltselector
bind	DP_LEFT_ALT	invprev			// inventory: previous item
bind	DP_RIGHT_ALT	invnext			// inventory: next item
bind	DP_UP_ALT	inven			// inventory: show / hide
bind	DP_DOWN_ALT	invuse			// inventory: use the item
bind	BTN_EAST_ALT	weapprev		// SELECT+A: previous weapon
bind	BTN_SOUTH_ALT	"cmd help"		// SELECT+B: help computer (scores in deathmatch)
bind	BTN_NORTH_ALT	"toggle cl_run"		// SELECT+X: walk / run
// fire, strafe and look work with SELECT held too
bind	BTN_WEST_ALT	+attack
bind	SHOULDR_LEFT_ALT	+moveleft
bind	SHOULDR_RIGHT_ALT	+moveright
bind	TRIG_LEFT_ALT	+lookup
bind	TRIG_RIGHT_ALT	+lookdown

//
// DEFAULT CVARS
//

set	viewsize	100
set	vid_fullscreen	0
set	crosshair	1
set	cl_run		1
set	hand		0
set	lookspring	0
set	lookstrafe	0
set	freelook	1
// the crosshair hits (no drift from the gun's offset), and a light vertical auto aim
set	aimfix		1
set	autoaim		1
// 4:3 display: original Quake 2 weapon position and FOV (no widescreen offsets)
set	sw_gunzposition	0
set	r_gunfov	-1
set	vid_maxfps	60
